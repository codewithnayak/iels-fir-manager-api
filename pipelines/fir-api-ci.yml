trigger:
  branches:
    include:
      - main

pool:
  name: IELS-SelfHosted

stages:
  - stage: CI
    displayName: Build and Test
    jobs:
      - job: Build
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Install .NET 10
            inputs:
              packageType: sdk
              version: 10.0.x

          - script: |
              set -euo pipefail
              dotnet restore IELS.FIR.slnx
              dotnet build IELS.FIR.slnx -c Release --no-restore
            displayName: Restore and Build

          - script: |
              dotnet test tests/IELS.FIR.Domain.Tests \
                -c Release --no-build
              dotnet test tests/IELS.FIR.Application.Tests \
                -c Release --no-build
              dotnet test tests/IELS.FIR.Api.Tests \
                -c Release --no-build
            displayName: Unit Tests

  - stage: Container
    displayName: Build and Push Image
    dependsOn: CI
    condition: succeeded()
    jobs:
      - job: ACRBuild
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Build Image in ACR
            inputs:
              azureSubscription: sc-iels-azure-dev
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az acr build \
                  --registry acrielsfirdev \
                  --image iels-fir-api:$(Build.BuildId) \
                  --image iels-fir-api:dev \
                  --file Dockerfile \
                  .
