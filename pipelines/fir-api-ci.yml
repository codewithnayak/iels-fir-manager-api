trigger:
  branches:
    include:
      - main

pool:
  name: IELS-SelfHosted

variables:
  acrName: acrielsfirdev
  acrLoginServer: acrielsfirdev.azurecr.io
  imageRepository: iels-fir-api

stages:
  - stage: CI
    displayName: Build and Test
    jobs:
      - job: Build
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Install .NET 10
            inputs:
              packageType: sdk
              version: 10.0.x

          - script: |
              set -euo pipefail

              dotnet restore IELS.FIR.slnx
              dotnet build IELS.FIR.slnx \
                -c Release \
                --no-restore
            displayName: Restore and Build

          - script: |
              set -euo pipefail

              dotnet test tests/IELS.FIR.Domain.Tests \
                -c Release --no-build

              dotnet test tests/IELS.FIR.Application.Tests \
                -c Release --no-build

              dotnet test tests/IELS.FIR.Api.Tests \
                -c Release --no-build
            displayName: Unit Tests

  - stage: Container
    displayName: Build and Push Docker Image
    dependsOn: CI
    condition: succeeded()
    jobs:
      - job: DockerBuild
        displayName: Docker Build and Push
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Build and Push Image to ACR
            inputs:
              azureSubscription: sc-iels-azure-dev
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                IMAGE="$(acrLoginServer)/$(imageRepository)"
                BUILD_TAG="$(Build.BuildId)"

                echo "Logging into Azure Container Registry..."
                az acr login --name "$(acrName)"

                echo "Building Docker image..."
                docker build \
                  --file Dockerfile \
                  --tag "$IMAGE:$BUILD_TAG" \
                  --tag "$IMAGE:dev" \
                  .

                echo "Pushing build-specific image..."
                docker push "$IMAGE:$BUILD_TAG"

                echo "Pushing development image..."
                docker push "$IMAGE:dev"

                echo "Successfully pushed:"
                echo "$IMAGE:$BUILD_TAG"
                echo "$IMAGE:dev"
  - stage: CD_Dev
    displayName: Deploy FIR API to Dev
    dependsOn: Container
    condition: succeeded()

    jobs:
      - deployment: DeployFirApi
        displayName: Deploy FIR API
        environment: IELS-Dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - task: AzureCLI@2
                  displayName: Deploy to Azure Container Apps
                  inputs:
                    azureSubscription: sc-iels-azure-dev
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      IMAGE="acrielsfirdev.azurecr.io/iels-fir-api:$(Build.BuildId)"

                      az containerapp update \
                        --name ca-iels-fir-dev \
                        --resource-group rg-iels-dev \
                        --image "$IMAGE"

                      echo "Deployed $IMAGE"
