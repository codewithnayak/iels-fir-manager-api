name: FIR API Quality Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-coverage:
    name: build-test-coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Restore dependencies
        run: dotnet restore

      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"codewithnayak_iels-fir-manager-api" \
            /o:"codewithnayak-sonar" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300

      - name: Build
        run: dotnet build --no-incremental --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test --no-build \
            --collect:"XPlat Code Coverage" \
            --settings coverage.runsettings \
            --results-directory ./TestResults \
            --logger "trx;LogFilePrefix=iels-tests"

      - name: Generate merged coverage report
        run: |
          reportgenerator \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:Html;TextSummary;Cobertura"

      - name: Enforce 85% line coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          report = "coverage-report/Cobertura.xml"
          root = ET.parse(report).getroot()

          covered = int(root.attrib["lines-covered"])
          valid = int(root.attrib["lines-valid"])

          if valid == 0:
              raise SystemExit("FAIL: No coverable lines found")

          coverage = covered * 100 / valid

          print(f"Covered lines: {covered}/{valid}")
          print(f"Overall line coverage: {coverage:.2f}%")

          if coverage < 85:
              raise SystemExit(
                  f"FAIL: Coverage {coverage:.2f}% is below 85%"
              )

          print("PASS: Minimum coverage requirement met")
          PY

      - name: Complete SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner end \
            /d:sonar.token="$SONAR_TOKEN"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iels-fir-coverage
          path: |
            coverage-report/
            TestResults/
          if-no-files-found: ignore
          retention-days: 2
